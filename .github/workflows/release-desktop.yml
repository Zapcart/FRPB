# FRPB Desktop — Auto-Update Release Pipeline
#
# Two jobs, two triggers:
#
#   1. `v*.*.*` tag push  -> package the Windows NSIS installer on a Windows
#      runner and PUBLISH it (plus `latest.yml`) to GitHub Releases on
#      Zapcart/FRPB. Installed apps embed the publish config from
#      apps/desktop/package.json (provider: github, owner: Zapcart, repo: FRPB)
#      so electron-updater finds the new .exe, downloads it and self-updates.
#      The app version is synced from the tag (e.g. `v1.1.0` -> `1.1.0`);
#      electron-updater compares semver, so every release MUST bump the version.
#
#   2. `main` branch push that touches apps/desktop or packages/shared ->
#      a build-validation pass (`--publish never`). It proves the desktop app
#      still compiles and packages without creating a release, so main stays
#      green between tagged releases.
#
# GH_TOKEN is provided automatically by GitHub Actions via
# `secrets.GITHUB_TOKEN` (contents: write) — no missing-token errors.

name: Release Desktop

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/release-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Tag push: build + publish to GitHub Releases ─────────────────────────
  publish:
    name: Build & publish Windows installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync app version with release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p='apps/desktop/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')" "$VERSION"
          echo "Packaging @frpb/desktop as $VERSION"

      - name: Typecheck desktop
        run: pnpm --filter @frpb/desktop run typecheck

      - name: Fetch platform-tools (adb)
        run: pnpm --filter @frpb/desktop run setup:platform-tools

      - name: Build desktop (electron + renderer)
        run: pnpm --filter @frpb/desktop run build

      - name: Package & publish to GitHub Releases
        run: pnpm --filter @frpb/desktop exec electron-builder --win --publish always

      - name: Log release artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path apps/desktop/release -Recurse -File |
            Select-Object FullName, Length

  # ── Main push: build validation + snapshot publish ────────────────────────
  verify:
    name: Build + publish latest snapshot
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck desktop
        run: pnpm --filter @frpb/desktop run typecheck

      - name: Fetch platform-tools (adb)
        run: pnpm --filter @frpb/desktop run setup:platform-tools

      - name: Build desktop (electron + renderer)
        run: pnpm --filter @frpb/desktop run build

      - name: Package installer
        run: pnpm --filter @frpb/desktop exec electron-builder --win --publish never

      - name: Upload installer to "latest" GitHub Release
        run: |
          $exePath = (Get-ChildItem -Path apps/desktop/release -Filter "*.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $exePath) { echo "No .exe found — aborting snapshot publish"; exit 1 }
          $exeName = [System.IO.Path]::GetFileName($exePath)
          echo "Uploading $exeName to latest release"

          # Create or update a release tagged "latest"
          $existing = gh release view latest --json id --jq '.id' 2>$null
          if ($existing) {
            gh release delete latest --yes 2>$null || $true
            gh release create latest --title "Latest Build" --notes "Auto-deployed from main — $(Get-Date -Format 'yyyy-MM-dd HH:mm')" --target main --draft:false
          } else {
            gh release create latest --title "Latest Build" --notes "Auto-deployed from main — $(Get-Date -Format 'yyyy-MM-dd HH:mm')" --target main --draft:false
          }
          gh release upload latest $exePath --clobber

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: frpb-desktop-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: warn
          retention-days: 7
