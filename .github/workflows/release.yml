# FRPB Desktop — Auto-Update Release Pipeline
#
# Triggered by pushing a version tag (`v*.*.*`, e.g. `v1.1.0`). Builds the
# Windows NSIS installer on a Windows runner (required so
# scripts/setup-platform-tools.js can download adb.exe into the bundle) and
# publishes it as a GitHub Release on Zapcart/FRPB. The packaged app embeds the
# publish config from apps/desktop/package.json (provider: github,
# owner: Zapcart, repo: FRPB), so electron-updater in installed apps can find
# the new .exe, download it and self-update.
#
# The app version is synced from the tag (e.g. `v1.1.0` → 1.1.0). electron-updater
# compares semantic versions, so every release MUST carry a higher version than
# the last one published.

name: Release Desktop

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync app version with release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p='apps/desktop/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')" "$VERSION"
          echo "Packaging @frpb/desktop as $VERSION"

      - name: Typecheck desktop
        run: pnpm --filter @frpb/desktop run typecheck

      - name: Fetch platform-tools (adb)
        run: pnpm --filter @frpb/desktop run setup:platform-tools

      - name: Build desktop (electron + renderer)
        run: pnpm --filter @frpb/desktop run build

      - name: Package & publish to GitHub Releases
        run: pnpm --filter @frpb/desktop exec electron-builder --win --publish always

      - name: Log release artifacts
        run: |
          Get-ChildItem -Path release -Recurse -File | Select-Object FullName, Length
        shell: pwsh
