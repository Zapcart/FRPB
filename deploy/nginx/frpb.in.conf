# FRPB — Nginx reverse proxy for frpb.in / www.frpb.in
#
# Install to: /etc/nginx/sites-available/frpb.in
# Enable with: ln -s /etc/nginx/sites-available/frpb.in /etc/nginx/sites-enabled/frpb.in
# Test with:   nginx -t  &&  systemctl reload nginx
#
# Certbot (python3-certbot-nginx) will manage the TLS certificates and the
# 443 server block automatically. The block below is the pre-SSL stage; run
# `certbot --nginx -d frpb.in -d www.frpb.in` once DNS points at this host.

upstream frpb_web {
    # Next.js (`next start`) bound to loopback only.
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---- HTTP :80 -------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name frpb.in www.frpb.in;

    # Allow ACME HTTP-01 challenges (used by Certbot) before the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Everything else is redirected to HTTPS (Certbot will enforce this once
    # the certificate is issued; keep it for the immediate post-SSL state).
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS :443 -----------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name frpb.in www.frpb.in;

    # Certbot-managed certificate paths (created by `certbot --nginx`).
    ssl_certificate     /etc/letsencrypt/live/frpb.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frpb.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip for text payloads.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Long-lived immutable caching for hashed Next.js build assets.
    location /_next/static/ {
        proxy_pass http://frpb_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Static media/public assets.
    location /public/ {
        proxy_pass http://frpb_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # API routes must never be cached by intermediaries.
    location /api/ {
        proxy_pass http://frpb_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Default application proxy (SSR pages, route handlers, etc.).
    location / {
        proxy_pass http://frpb_web;
        proxy_http_version 1.1;

        # Required proxy headers so Next.js sees the real client + protocol
        # (Supabase auth cookies and Razorpay redirects depend on these).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / SSE upgrade support.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
